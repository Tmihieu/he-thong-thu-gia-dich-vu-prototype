s=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"db_handovers\" value=\"NH\u1eacT K\u00dd THU &amp;amp; B\u00c0N GIAO (RS_CONFIRMED / HANDOVERS)&amp;#xa;X\u00e1c nh\u1eadn thu t\u1eebng h\u1ed9 (Ti\u1ec1n m\u1eb7t/CK) \u00b7 L\u1ecbch s\u1eed n\u1ed9p ti\u1ec1n m\u1eb7t c\u1ee7a nh\u00e2n vi\u00ean v\u1ec1 th\u1ee7 qu\u1ef9 c\u00f4ng ty\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#cbd5e1;fontColor=#0f172a;fontSize=12;fontStyle=0;align=left;spacing=10;\" vertex=\"1\" parent=\"grp_data\">\n          <mxGeometry x=\"520\" y=\"160\" width=\"510\" height=\"70\" as=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"db_reconcile\" value=\"C\u01a0 CH\u1ebe \u0110\u1ed0I SO\u00c1T T\u1ed4NG TH\u1ec2 KH\u00d4NG L\u1eaaN L\u1ed8N&amp;#xa;Ch\u00eanh l\u1ec7ch = [Ti\u1ec1n c\u00f4ng ty n\u1ed9p v\u1ec1 x\u00e3 (Phi\u1ebfu thu)] \u2212 [Ti\u1ec1n \u0111\u00e3 thu c\u1ee7a h\u1ed9 (Ng\u01b0\u1eddi thu b\u00e1o)]&amp;#xa;Ti\u1ec1n thu c\u1ee7a d\u00e2n thu\u1ed9c c\u00f4ng ty; x\u00e3 ch\u1ec9 gi\u00e1m s\u00e1t v\u00e0 nh\u1eadn n\u1ed9p ph\u1ea7n ti\u1ec1n x\u1eed l\u00fd theo quy \u0111\u1ecbnh.\" style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#fef08a;strokeColor=#ca8a04;fontColor=#713f12;fontSize=12;fontStyle=1;align=left;spacing=10;\" vertex=\"1\" parent=\"grp_data\">\n          <mxGeometry x=\"1060\" y=\"160\" width=\"480\" height=\"70\" as=\"geometry\" />\n        </mxCell>\n\n        <!-- FLOW CONNECTORS -->\n        <!-- Admin to Config -->\n        <mxCell id=\"flow_adm_data\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;entryX=0.2;entryY=0;entryDx=0;entryDy=0;strokeColor=#8b5cf6;strokeWidth=2;\" edge=\"1\" parent=\"1\" source=\"adm_config\" target=\"db_areas\">\n          <mxGeometry relative=\"1\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"lbl_adm_data\" value=\"C\u1ea5u h\u00ecnh &amp;amp; Bi\u1ec3u gi\u00e1\" style=\"edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=11;fontColor=#6d28d9;background=#ffffff;\" vertex=\"1\" connectable=\"0\" parent=\"flow_adm_data\">\n          <mxGeometry x=\"-0.2\" relative=\"1\" as=\"geometry\"><mxPoint as=\"offset\" /></mxGeometry>\n        </mxCell>\n\n        <!-- Commune to Charges -->\n        <mxCell id=\"flow_com_charges\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;entryX=0.5;entryY=0;entryDx=0;entryDy=0;strokeColor=#2563eb;strokeWidth=2;\" edge=\"1\" parent=\"1\" source=\"com_requests\" target=\"db_charges\">\n          <mxGeometry relative=\"1\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"lbl_com_charges\" value=\"1. Ph\u00e1t h\u00e0nh YCT sinh kho\u1ea3n thu\" style=\"edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=11;fontColor=#1d4ed8;background=#ffffff;\" vertex=\"1\" connectable=\"0\" parent=\"flow_com_charges\">\n          <mxGeometry x=\"-0.2\" relative=\"1\" as=\"geometry\"><mxPoint as=\"offset\" /></mxGeometry>\n        </mxCell>\n\n        <!-- Collector updates Charges -->\n        <mxCell id=\"flow_col_charges\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;entryX=0.8;entryY=0;entryDx=0;entryDy=0;strokeColor=#f59e0b;strokeWidth=2;\" edge=\"1\" parent=\"1\" source=\"col_update\" target=\"db_charges\">\n          <mxGeometry relative=\"1\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"lbl_col_charges\" value=\"2. X\u00e1c nh\u1eadn \u0111\u00e3 thu ti\u1ec1n h\u1ed9\" style=\"edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=11;fontColor=#b45309;background=#ffffff;\" vertex=\"1\" connectable=\"0\" parent=\"flow_col_charges\">\n          <mxGeometry x=\"-0.1\" relative=\"1\" as=\"geometry\"><mxPoint as=\"offset\" /></mxGeometry>\n        </mxCell>\n\n        <!-- Collector to Company Handover -->\n        <mxCell id=\"flow_col_cop\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;entryX=1;entryY=0.5;entryDx=0;entryDy=0;exitX=0;exitY=0.5;exitDx=0;exitDy=0;strokeColor=#f59e0b;strokeWidth=2;dashed=1;\" edge=\"1\" parent=\"1\" source=\"col_handover\" target=\"cop_collectors\">\n          <mxGeometry relative=\"1\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"lbl_col_cop\" value=\"B\u00e0n giao ti\u1ec1n m\u1eb7t\" style=\"edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=11;fontColor=#b45309;background=#ffffff;\" vertex=\"1\" connectable=\"0\" parent=\"flow_col_cop\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><mxPoint as=\"offset\" /></mxGeometry>\n        </mxCell>\n\n        <!-- Company to Commune Remit -->\n        <mxCell id=\"flow_cop_com\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;entryX=1;entryY=0.5;entryDx=0;entryDy=0;exitX=0;exitY=0.5;exitDx=0;exitDy=0;strokeColor=#16a34a;strokeWidth=2;\" edge=\"1\" parent=\"1\" source=\"cop_remit\" target=\"com_recon\">\n          <mxGeometry relative=\"1\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"lbl_cop_com\" value=\"3. Chuy\u1ec3n ti\u1ec1n ph\u1ea7n x\u1eed l\u00fd v\u1ec1 x\u00e3\" style=\"edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=11;fontColor=#15803d;background=#ffffff;\" vertex=\"1\" connectable=\"0\" parent=\"flow_cop_com\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><mxPoint as=\"offset\" /></mxGeometry>\n        </mxCell>\n\n        <!-- Commune Receipts to Company -->\n        <mxCell id=\"flow_com_receipts\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1;entryX=0.2;entryY=0;entryDx=0;entryDy=0;strokeColor=#2563eb;strokeWidth=2;\" edge=\"1\" parent=\"1\" source=\"com_recon\" target=\"db_receipts\">\n          <mxGeometry relative=\"1\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"lbl_com_receipts\" value=\
