name: vsmt

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vsmt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      # Cổng của db trong mạng compose; ${POSTGRES_PORT} là cổng mở ra máy host.
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CITIZEN_DEMO_OTP: ${CITIZEN_DEMO_OTP:-123456}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      TZ: Asia/Ho_Chi_Minh
    ports:
      # App mobile (Expo Go) gọi thẳng backend qua IP LAN của laptop.
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Ảnh người dân tải lên (T47: vsmt.upload-dir mặc định uploads/, tính từ WORKDIR /app); giữ lại khi container
      # bị tạo lại, vì CSDL vẫn lưu tên ảnh.
      - vsmt-uploads:/app/uploads

  jmix-admin:
    build: ./jmix-admin
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    # Không mở cổng ra host: web (nginx) proxy /jmix/ tới đây và nhúng vào trang admin bằng iframe.
    # Cần backend đã chạy Flyway trước (bảng districts, areas, companies, fee_types, users).

  web:
    build: ./web
    depends_on:
      - backend
      - jmix-admin
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  vsmt-db-data:
  vsmt-uploads:
