name: vsmt_citizen
description: "Ứng dụng người dân - Thu giá dịch vụ VSMT xã Đông Thạnh (bản Flutter)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo-dong-thanh.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: assets/android-icon-background.png
  adaptive_icon_foreground: assets/android-icon-foreground.png
  min_sdk_android: 21
