server {
    listen 80;
    root /usr/share/nginx/html;
    # DNS nội bộ của Docker: phân giải lại "backend" mỗi 10s, nên khi compose tạo lại container backend (IP mới)
    # hoặc backend lên sau web thì nginx vẫn nối được.
    resolver 127.0.0.11 valid=10s;

    # Web gọi API bằng đường dẫn tương đối /api (khi dev là proxy của Vite).
    location /api/ {
        # Mặc định nginx chặn body quá 1 MB (413). Hiện chỉ app người dân tải ảnh và app gọi thẳng cổng backend, không qua
        # đây; giới hạn để ngang server.tomcat.max-swallow-size của backend cho đồng bộ nếu sau này tải ảnh qua /api.
        client_max_body_size 50m;
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # React Router: đường dẫn không phải file tĩnh trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
