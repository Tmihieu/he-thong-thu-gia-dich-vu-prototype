map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # DNS nội bộ của Docker: phân giải lại "backend" mỗi 10s, nên khi compose tạo lại container backend (IP mới)
    # hoặc backend lên sau web thì nginx vẫn nối được.
    resolver 127.0.0.11 valid=10s;

    # Web gọi API bằng đường dẫn tương đối /api (khi dev là proxy của Vite).
    location /api/ {
        # Mặc định nginx chặn body quá 1 MB (413). Hiện chỉ app người dân tải ảnh và app gọi thẳng cổng backend, không qua
        # đây; giới hạn để ngang server.tomcat.max-swallow-size của backend cho đồng bộ nếu sau này tải ảnh qua /api.
        client_max_body_size 50m;
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # Jmix Admin: service riêng, nhúng vào trang admin bằng iframe cùng origin. Cần WebSocket cho Vaadin Push.
    location /jmix/ {
        set $jmix http://jmix-admin:8081;
        proxy_pass $jmix;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        # Jmix gửi X-Frame-Options: DENY; cùng origin thì cho nhúng.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # App người dân bản web (Flutter, public/citizen): SPA riêng dưới /citizen.
    location /citizen/ {
        try_files $uri $uri/ /citizen/index.html =404;
    }

    # React Router: đường dẫn không phải file tĩnh trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
