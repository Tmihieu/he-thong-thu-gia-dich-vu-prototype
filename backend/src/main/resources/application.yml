# Cấu hình chung. Thông tin kết nối lấy từ biến môi trường; khi chạy trên máy dev,
# file .env ở gốc repo (xem .env.example) được nạp như một nguồn thuộc tính.
spring:
  application:
    name: vsmt
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vsmt}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      # Ảnh người dân (PhotoStorage): một ảnh mỗi lần tải, tối đa 5 MB.
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    # Không dùng tài khoản mặc định của Spring Security; đăng nhập qua AuthService + JWT.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  tomcat:
    # Ảnh quá cỡ bị chặn trước khi đọc hết body; mặc định Tomcat chỉ đọc bỏ 2 MB còn lại rồi cắt kết nối, app nhận
    # "Network request failed" thay vì 422 FILE_TOO_LARGE. Ảnh chụp đầy đủ độ phân giải hiếm khi quá 50 MB.
    max-swallow-size: 50MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

vsmt:
  jwt:
    # Bắt buộc, tối thiểu 32 ký tự; thiếu thì ứng dụng không khởi động.
    secret: ${JWT_SECRET:}
    access-token-ttl: 8h
    # Token app người dân sống lâu hơn để không phải đăng nhập lại mỗi ngày.
    citizen-token-ttl: 7d
  citizen:
    # OTP cố định mô phỏng (O7): không gửi SMS, không phải bí mật; ghi ở docs/demo-accounts.md.
    demo-otp: ${CITIZEN_DEMO_OTP:123456}
  # Thư mục lưu ảnh người dân tải lên (chợ đồ cũ, rác cồng kềnh); đường dẫn tương đối tính từ thư mục chạy
  # backend. Không commit (xem .gitignore).
  upload-dir: ${UPLOAD_DIR:uploads}
  goong:
    # Khóa Goong chỉ đọc ở backend (gợi ý đường khi nhập hồ sơ hộ). Để trống thì tắt gợi ý Goong, danh mục nội bộ vẫn dùng được.
    api-key: ${GOONG_API_KEY:}
  sepay:
    # Khóa SePay gửi kèm webhook (header "Authorization: Apikey <khóa>"). Để trống thì webhook trả 503, không ghi gì.
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}

---
# Profile demo: nạp thêm seed dữ liệu giả (db/seed). Mặc định khi ./mvnw spring-boot:run.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
# Chỉ demo: cho bản web của app người dân (Flutter web, cổng bất kỳ trên máy này) gọi API.
vsmt:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
