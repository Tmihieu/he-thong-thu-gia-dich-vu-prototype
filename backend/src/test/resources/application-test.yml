# Profile test: chỉ chạy migration schema, không nạp seed demo.
# Datasource do Testcontainers cấp (@ServiceConnection trong IntegrationTest).
spring:
  flyway:
    locations: classpath:db/migration

vsmt:
  jwt:
    # Khóa giả chỉ dùng trong test, không dùng ở môi trường nào khác.
    secret: test-only-secret-khong-dung-o-dau-khac-0123456789
  # Ảnh tải lên trong test nằm ở thư mục tạm của hệ điều hành, không lẫn vào repo.
  upload-dir: ${java.io.tmpdir}/vsmt-test-uploads
