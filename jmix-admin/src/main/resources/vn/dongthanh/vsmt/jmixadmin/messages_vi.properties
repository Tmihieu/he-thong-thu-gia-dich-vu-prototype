io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.tooltipMessage=<div>Biểu thức JPQL được thêm vào mệnh đề "where" của truy vấn. Dùng {E} thay cho bí danh của thực thể.<br><br>Điều kiện chỉ có tối đa một tham số, ký hiệu <b>?</b>.<br/>Có thể dùng các tham số định sẵn:<ul><li><code>:current_user_&lt;thuộc tính&gt;</code> – thuộc tính của người dùng hiện tại.</li><li><code>:session_&lt;thuộc tính&gt;</code> – thuộc tính của phiên.</li></ul>Nếu dùng <code>like</code>, giá trị được tự bọc thành <code>(?i)%value%</code> để tìm không phân biệt hoa thường.<br/><br/>Ví dụ lọc theo thuộc tính của tập hợp <code>tags</code> đã join:<br/><code>t.name like ?</code></div>
