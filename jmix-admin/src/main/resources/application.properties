spring.application.name=jmix-admin
server.port=${JMIX_PORT:8081}
# Chạy sau nginx tại /jmix, cùng domain với web để nhúng iframe và dùng chung cookie.
server.servlet.context-path=/jmix
server.forward-headers-strategy=framework

# Schema do Flyway của backend quản lý; Jmix không tạo hay đổi bảng.
main.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vsmt}
main.datasource.username=${POSTGRES_USER}
main.datasource.password=${POSTGRES_PASSWORD}
main.datasource.hikari.maximum-pool-size=5

jmix.core.available-locales=en
jmix.core.default-locale=en

vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,io.jmix.flowui,io.jmix,vn.dongthanh
main.liquibase.enabled=false

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=vn/dongthanh/vsmt/jmixadmin/menu.xml

# Điền sẵn tài khoản demo (docs/demo-accounts.md) ở màn đăng nhập; đặt JMIX_DEMO_USERNAME= để tắt.
vsmt.login.default-username=${JMIX_DEMO_USERNAME:admin}
vsmt.login.default-password=${JMIX_DEMO_PASSWORD:Demo@2026}
