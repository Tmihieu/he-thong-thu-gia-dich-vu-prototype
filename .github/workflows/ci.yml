# Chạy mỗi lần push nhánh và mỗi PR. Render chỉ deploy main khi các job này qua (render.yaml: autoDeployTrigger: checksPass).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Test tích hợp dùng Testcontainers: runner ubuntu có sẵn Docker.
      - run: sh ./mvnw -B -ntp verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  jmix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jmix-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Chỉ biên dịch; bản Vaadin production nặng, để Dockerfile build lúc deploy.
      - run: sh ./gradlew compileJava --no-daemon
